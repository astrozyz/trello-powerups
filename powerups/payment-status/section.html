<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Status</title>
    <style>
      body { margin: 0; color: #b6c2cf; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #payment-status { padding: 4px 0; }
      #status { margin: 0 0 10px; }
      #actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button { border: 0; border-radius: 4px; padding: 8px 12px; background: #0c66e4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #0055cc; }
      button.secondary { background: #596773; }
      button.secondary:hover { background: #44515b; }
      button:disabled { background: #8590a2; cursor: wait; }
      .empty { color: #9fadbc; }
      .error { color: #ff9c8f; }
    </style>
  </head>
  <body>
    <main id="payment-status">
      <p id="status">Loading payment status…</p>
      <div id="actions"></div>
    </main>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./config.js?v=202608100225"></script>
    <script src="../shared/payment-status-rules.js?v=202608100225"></script>
    <script src="../shared/trello-payment-api.js?v=202608100225"></script>
    <script src="./section.js?v=202608100225"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflow Mover</title>
    <style>
      body { margin: 0; color: #172b4d; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #workflow-mover { padding: 4px 0; }
      #status { margin: 0 0 10px; color: #b6c2cf; }
      #actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button { border: 0; border-radius: 4px; padding: 8px 12px; background: #0c66e4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #0055cc; }
      button:disabled { background: #8590a2; cursor: wait; }
      .empty { color: #626f86; }
      .error { color: #ae2e24; }
    </style>
  </head>
  <body>
    <main id="workflow-mover">
      <p id="status">Loading workflow actions…</p>
      <div id="actions"></div>
    </main>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./config.js?v=202608100141"></script>
    <script src="../shared/workflow-rules.js?v=202608100141"></script>
    <script src="../shared/trello-workflow-api.js?v=202608100141"></script>
    <script src="./section.js?v=202608100141"></script>
  </body>
</html>
